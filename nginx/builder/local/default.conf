# WebSocket: Connection harus mengikuti Upgrade (bukan string tetap), supaya handshake tidak gagal.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # Docker embedded DNS — resolve upstream saat request (bukan saat nginx start)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Increase buffer sizes for better performance
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    # Request-Line panjang (JWT di ?token=) — default nginx 1k bisa 414
    large_client_header_buffers 4 32k;
    client_header_buffer_size 16k;
    proxy_buffer_size 4k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;

    # 1. Frontend (Vite Dev Server)
    # proxy_pass tanpa URI path → URI asli (/...) diteruskan utuh
    location / {
        set $upstream_frontend frontend-dev:5173;
        proxy_pass http://$upstream_frontend;
        proxy_http_version 1.1;
        
        # WebSocket support untuk HMR (Hot Module Replacement)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings untuk WebSocket
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Disable buffering untuk real-time updates
        proxy_buffering off;
    }
    
    # Dashboard realtime — prefix /api/v1/ws seperti API REST (Upgrade wajib untuk WS)
    location /api/v1/ws/ {
        set $upstream_backend backend-dev:8000;
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # WebSocket endpoint untuk Vite HMR
    location /ws {
        set $upstream_frontend frontend-dev:5173;
        proxy_pass http://$upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # 2. Static Files (Uploads) - Must be before /api/v1/ to avoid conflicts
    location /uploads/ {
        set $upstream_backend backend-dev:8000;
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache static files
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # Set correct content types
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            image/svg+xml svg;
        }
    }

    # 2.1. Backend API
    location /api/v1/ {
        set $upstream_backend backend-dev:8000;
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # TAMBAHKAN INI: Agar Swagger tahu lokasi aslinya
        proxy_set_header X-Forwarded-Prefix /api/v1;
        
        # Increase timeouts for file serving
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Don't buffer responses for media files
        proxy_buffering off;
    }

    # 3. Adminer — strip prefix /dd/
    location /dd/ {
        set $upstream_adminer adminer:8080;
        rewrite ^/dd/(.*)$ /$1 break;
        proxy_pass http://$upstream_adminer;
        proxy_set_header Host $host;
    }
    
}
