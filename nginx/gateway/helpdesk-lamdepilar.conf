# Salin ke global-gateway conf.d (mis. /etc/nginx/conf.d/helpdesk-lamdepilar.conf).
# Pastikan gateway join jaringan Docker yang sama dengan stack app (app-bridge).
#
# Nama upstream mengikuti container_name di docker-compose.yml:
#   helpdesk_adminer, helpdesk-minio, helpdesk_api_prod, helpdesk_ui_prod
# Variabel map sengaja diberi prefix helpdesk_ agar tidak bentrok dengan
# map $connection_upgrade milik vhost lain di nginx global yang sama.

map $http_upgrade $helpdesk_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream helpdesk_adminer_backend {
    server helpdesk_adminer:8080;
}

upstream helpdesk_minio_backend {
    server helpdesk-minio:9000;
}

upstream helpdesk_api_backend {
    server helpdesk_api_prod:8000;
}

upstream helpdesk_ui_backend {
    server helpdesk_ui_prod:80;
}

server {
    listen 80;
    server_name helpdesk.dpupkundip.my.id;

    client_max_body_size 50M;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 32k;
    client_header_buffer_size 16k;
    proxy_buffer_size 4k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Selaras dengan nginx/builder/prod/default.conf (Turnstile + SPA).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; worker-src 'self' blob:;" always;

    # --- 1. ADMINER (/dd/) ---
    location /dd/ {
        proxy_pass http://helpdesk_adminer_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /dd;

        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }

    location = /dd {
        return 301 $scheme://$host$request_uri/;
    }

    # --- 2. STATIC FILES (Uploads) ---
    location /uploads/ {
        proxy_pass http://helpdesk_api_backend/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 30d;
        add_header Cache-Control "public, immutable";

        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            image/svg+xml svg;
        }

        location ~* \.(php|pl|py|jsp|sh|cgi)$ {
            deny all;
        }
    }

    # --- 3. PUBLIC MINIO FILES via domain utama (/minio/...) ---
    # URL publik object: https://helpdesk.ferxcode.my.id/minio/<bucket>/<object_key>
    # Samakan dengan S3_PUBLIC_BROWSER_BASE_URL (tanpa trailing slash).
    location /minio/ {
        proxy_pass http://helpdesk_minio_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /minio;

        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        proxy_send_timeout 300;
        proxy_buffering off;
    }

    # --- 4. DASHBOARD REALTIME (WebSocket) — harus lebih spesifik dari /api/v1/ ---
    location /api/v1/ws/ {
        proxy_pass http://helpdesk_api_backend/api/v1/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $helpdesk_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;

        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # --- 5. BACKEND API (/api/v1/) ---
    location /api/v1/ {
        proxy_pass http://helpdesk_api_backend/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api/v1;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # --- 6. FRONTEND (container nginx statis) ---
    location / {
        proxy_pass http://helpdesk_ui_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Content-Security-Policy;

        add_header Cache-Control "no-store, no-cache, must-revalidate";

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $helpdesk_connection_upgrade;
    }
}
